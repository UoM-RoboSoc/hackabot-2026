<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="icon" type="image/png" href="/brand/Logo.png" />
    <link rel="apple-touch-icon" href="/brand/Logo.png" />
    <title>Hack‑A‑Bot 2026 • Manchester’s Premier Student Hackathon</title>
    <meta name="description" content="Tickets live now. Manchester’s premier student hackathon returns 21-22 March 2026 at the Nancy Rothwell Building in Manchester. Join us for 24 hours of creativity, collaboration, and cutting-edge robotics." />
    <meta property="og:title" content="Hack‑A‑Bot 2026" />
    <meta property="og:description" content="Tickets live now. Manchester’s Premier Student Hackathon. Join us 21-22 March 2026 at the Nancy Rothwell Building in Manchester." />
    <meta property="og:image" content="/brand/Title_Date_Logo_BG.png" />
    <meta property="og:image:alt" content="Hack‑A‑Bot 2026 logo with event date" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hackabot-2026.com/" />
    <meta property="og:site_name" content="Hack‑A‑Bot 2026" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hack‑A‑Bot 2026" />
    <meta name="twitter:description" content="Tickets live now. Manchester’s Premier Student Hackathon. Join us 21-22 March 2026 in Manchester." />
    <meta name="twitter:image" content="/brand/Title_Date_Logo_BG.png" />
    <meta name="twitter:image:alt" content="Hack‑A‑Bot 2026 logo with event date" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var merchRoute = params.get('merch');

        if (!merchRoute) {
          return;
        }

        var merchTitle = 'Hack‑A‑Bot 2026 Merch';
        var merchDescription = 'Choose your Hack‑A‑Bot merch. Tees, crewnecks, hoodies, and RoboSoc hoodie, ready for collection at Hack‑A‑Bot 2026.';
        var merchImage = '/brand/merch.png';
        var merchImageAlt = 'Hack‑A‑Bot 2026 merch lineup';
        var merchUrl = window.location.origin + '/?merch=' + encodeURIComponent(merchRoute);

        document.title = merchTitle;

        function setMeta(selector, content) {
          var el = document.querySelector(selector);
          if (el) {
            el.setAttribute('content', content);
          }
        }

        setMeta('meta[name="description"]', merchDescription);
        setMeta('meta[property="og:title"]', merchTitle);
        setMeta('meta[property="og:description"]', merchDescription);
        setMeta('meta[property="og:image"]', merchImage);
        setMeta('meta[property="og:image:alt"]', merchImageAlt);
        setMeta('meta[property="og:url"]', merchUrl);
        setMeta('meta[name="twitter:title"]', merchTitle);
        setMeta('meta[name="twitter:description"]', merchDescription);
        setMeta('meta[name="twitter:image"]', merchImage);
        setMeta('meta[name="twitter:image:alt"]', merchImageAlt);
      })();
    </script>
  </head>
  <body>
    <a href="#hero" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  </body>
</html>
