<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hack-A-Bot 2026 — Product Image Template (IG 4:5)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --text: rgba(250,250,252,0.96);
      --muted: rgba(250,250,252,0.64);
      --accent: #ff3a57;
      --panel: rgba(17, 19, 24, 0.80);
      --stroke: rgba(255, 75, 105, 0.24);
      --shadow: 0 24px 80px rgba(0,0,0,0.52);
      --radius-xl: 40px;
      --radius-lg: 26px;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:18px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 700px at 15% 15%, rgba(255,58,87,0.10), transparent 60%),
        radial-gradient(1000px 700px at 85% 85%, rgba(255,58,87,0.08), transparent 60%),
        linear-gradient(180deg, #06070b 0%, #0a0b13 100%);
    }

    .ig-wrap{
      width: min(740px, 92vw, calc(92vh * 4 / 5));
      max-height: 92vh;
      aspect-ratio: 4 / 5;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,58,87,0.12), transparent 55%),
        linear-gradient(180deg, #0d0f14 0%, #090b11 100%);
    }

    .ig-wrap::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
        radial-gradient(rgba(255,58,87,0.11) 1px, transparent 1px);
      background-size: 68px 68px, 108px 108px;
      opacity:0.13;
    }

    .content{
      position:absolute;
      inset:0;
      padding: clamp(18px, 3vw, 34px);
      display:flex;
      flex-direction:column;
      gap: clamp(14px, 2.1vw, 20px);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .headerLogo{
      height: clamp(36px, 4.7vw, 52px);
      width: auto;
      max-width: min(50vw, 340px);
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 10px 18px rgba(255,58,87,0.18));
    }

    .tag{
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,100,128,0.9);
      white-space: nowrap;
    }

    .productPanel{
      flex:1 1 auto;
      border-radius: var(--radius-xl);
      padding: clamp(16px, 2.4vw, 24px);
      background:
        radial-gradient(140% 90% at 50% 0%, rgba(255,58,87,0.12), transparent 60%),
        linear-gradient(180deg, rgba(26, 28, 34, 0.82), rgba(14, 16, 22, 0.84));
      border:1px solid var(--stroke);
      box-shadow: 0 20px 65px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,58,87,0.08) inset;
      display:flex;
      flex-direction:column;
      gap: clamp(12px, 1.8vw, 16px);
      min-height: 0;
    }

    .mediaFrame{
      flex:1 1 auto;
      min-height:0;
      border-radius: 28px;
      border:1px solid rgba(255,100,128,0.20);
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(255,58,87,0.10), transparent 60%),
        rgba(9,11,16,0.65);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .productImage{
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display:block;
    }

    .meta{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 16px;
    }

    .title{
      font-size: clamp(24px, 3.1vw, 38px);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.08;
      white-space: nowrap;
    }

    .subtitle{
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(14px, 1.6vw, 19px);
      line-height: 1.25;
    }

    .chip{
      flex: 0 0 auto;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,100,128,0.28);
      background: rgba(255,58,87,0.12);
      color: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 440px){
      .headerLogo{ height: 32px; max-width: 56vw; }
      .tag{ font-size: 11px; letter-spacing: 0.16em; }
      .title{ font-size: 20px; }
      .subtitle{ font-size: 13px; }
      .chip{ padding: 9px 12px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="ig-wrap" role="img" aria-label="Instagram portrait product template for Hack-A-Bot 2026">
    <div class="content">
      <div class="topbar">
        <img class="headerLogo" src="../../header_logo.png" alt="Hack-A-Bot 2026" />
        <div class="tag">Product Drop</div>
      </div>

      <div class="productPanel">
        <div class="mediaFrame">
          <img class="productImage" src="../../concept.png" alt="Product concept" />
        </div>

        <div class="meta">
          <div>
            <div class="title">Heavyweight Tee</div>
            <div class="subtitle">Swap image and copy for each product post.</div>
          </div>
          <div class="chip">Limited</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
