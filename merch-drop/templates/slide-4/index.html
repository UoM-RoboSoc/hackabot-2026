<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hack-A-Bot 2026 - Slide 4 (How to Order)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --text: rgba(250,250,252,0.96);
      --muted: rgba(250,250,252,0.62);
      --accent: #ff3a57;
      --shadow: 0 20px 74px rgba(0,0,0,0.56);
      --stroke: rgba(255, 80, 110, 0.22);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:18px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 900px at 20% 10%, rgba(255,58,87,0.10), transparent 58%),
        radial-gradient(1100px 900px at 85% 85%, rgba(255,58,87,0.08), transparent 62%),
        linear-gradient(180deg, #06070b 0%, #090b12 100%);
    }

    .ig-wrap{
      width: min(740px, 92vw, calc(92vh * 4 / 5));
      max-height: 92vh;
      aspect-ratio: 4 / 5;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,58,87,0.14), transparent 56%),
        linear-gradient(180deg, #0d0f14 0%, #090b11 100%);
    }

    .ig-wrap::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        radial-gradient(rgba(255,58,87,0.11) 1px, transparent 1px);
      background-size: 72px 72px, 110px 110px;
      opacity:0.12;
    }

    .content{
      position:absolute;
      inset:0;
      padding: clamp(18px, 3vw, 34px);
      display:flex;
      flex-direction:column;
      gap: clamp(14px, 2.1vw, 20px);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .headerLogo{
      height: clamp(36px, 4.8vw, 52px);
      width: auto;
      max-width: min(50vw, 340px);
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 10px 18px rgba(255,58,87,0.18));
    }

    .tag{
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 105, 132, 0.9);
      white-space: nowrap;
    }

    .panel{
      flex:1 1 auto;
      border-radius: 40px;
      border:1px solid var(--stroke);
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255,58,87,0.14), transparent 62%),
        linear-gradient(180deg, rgba(27, 29, 36, 0.82), rgba(14, 16, 22, 0.84));
      box-shadow: 0 20px 70px rgba(0,0,0,0.44), 0 0 0 1px rgba(255,58,87,0.08) inset;
      padding: clamp(16px, 2.4vw, 24px);
      display:flex;
      flex-direction:column;
      gap: clamp(12px, 1.8vw, 16px);
      min-height: 0;
    }

    .steps{
      margin: 0;
      padding: 0;
      list-style: none;
      display:flex;
      flex-direction:column;
      flex: 1 1 auto;
      min-height: 0;
      gap: 8px;
    }

    .step{
      border-radius: 14px;
      border:1px solid rgba(255,100,128,0.22);
      background: rgba(14, 16, 22, 0.8);
      padding: 8px 12px;
      font-size: clamp(40px, 4.7vw, 66px);
      font-weight: 700;
      line-height: 1.18;
      display:flex;
      align-items:center;
      gap: 12px;
      flex: 1 1 0;
      min-height: 0;
    }

    .stepNum{
      width: clamp(56px, 6.2vw, 88px);
      height: clamp(56px, 6.2vw, 88px);
      border-radius: 999px;
      border: 1px solid rgba(255, 100, 130, 0.36);
      background: rgba(255, 58, 87, 0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: clamp(28px, 3.1vw, 44px);
      font-weight: 800;
      line-height: 1;
      flex: 0 0 auto;
    }

    .deadline{
      border-radius: 18px;
      border:1px solid rgba(255,100,128,0.26);
      background: linear-gradient(180deg, rgba(255,58,87,0.24), rgba(255,58,87,0.12));
      padding: 12px 14px;
      text-align:center;
    }

    .deadlineKicker{
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(250,250,252,0.74);
      margin-bottom: 6px;
    }

    .deadlineText{
      font-size: clamp(22px, 2.8vw, 34px);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.1;
      white-space: nowrap;
    }

    .nextLine{
      text-align:center;
      color: var(--muted);
      font-size: clamp(13px, 1.45vw, 18px);
      line-height: 1.3;
      font-weight: 600;
    }

    .ctaBtn{
      width: 100%;
      border-radius: 16px;
      border:1px solid rgba(255,120,140,0.24);
      background: linear-gradient(180deg, #ff4b65, #dc2a46);
      box-shadow: 0 14px 36px rgba(255,55,85,0.22), 0 10px 26px rgba(0,0,0,0.34);
      padding: 16px 22px;
      text-align:center;
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.98);
    }

    @media (max-width: 440px){
      .headerLogo{ height: 32px; max-width: 56vw; }
      .tag{ font-size: 11px; letter-spacing: 0.15em; }
      .step{ font-size: 32px; }
      .stepNum{ width: 44px; height: 44px; font-size: 22px; }
      .deadlineText{ font-size: 19px; }
      .ctaBtn{ font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="ig-wrap" role="img" aria-label="How to order slide for Hack-A-Bot supporter merch">
    <div class="content">
      <div class="topbar">
        <img class="headerLogo" src="../../header_logo.png" alt="Hack-A-Bot 2026" />
        <div class="tag">Order Guide</div>
      </div>

      <section class="panel">
        <div class="deadline">
          <div class="deadlineKicker">Deadline</div>
          <div class="deadlineText">Orders close 20 February</div>
        </div>

        <ol class="steps" aria-label="Order steps">
          <li class="step"><span class="stepNum">1</span>Link in bio</li>
          <li class="step"><span class="stepNum">2</span>Choose item + size</li>
          <li class="step"><span class="stepNum">3</span>Checkout on SU website</li>
        </ol>

        <div class="ctaBtn">Order now</div>
        <div class="nextLine">Collect at Hack-A-Bot on 21st March 2026</div>
      </section>
    </div>
  </div>
</body>
</html>
