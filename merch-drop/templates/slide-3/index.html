<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hack-A-Bot 2026 - Slide 3 (Lineup)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --text: rgba(250,250,252,0.96);
      --muted: rgba(250,250,252,0.62);
      --accent: #ff3a57;
      --shadow: 0 20px 74px rgba(0,0,0,0.56);
      --stroke: rgba(255, 80, 110, 0.22);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:18px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 900px at 20% 10%, rgba(255,58,87,0.10), transparent 58%),
        radial-gradient(1100px 900px at 85% 85%, rgba(255,58,87,0.08), transparent 62%),
        linear-gradient(180deg, #06070b 0%, #090b12 100%);
    }

    .ig-wrap{
      width: min(740px, 92vw, calc(92vh * 4 / 5));
      max-height: 92vh;
      aspect-ratio: 4 / 5;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,58,87,0.14), transparent 56%),
        linear-gradient(180deg, #0d0f14 0%, #090b11 100%);
    }

    .ig-wrap::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        radial-gradient(rgba(255,58,87,0.11) 1px, transparent 1px);
      background-size: 72px 72px, 110px 110px;
      opacity:0.12;
    }

    .content{
      position:absolute;
      inset:0;
      padding: clamp(18px, 3vw, 34px);
      display:flex;
      flex-direction:column;
      gap: clamp(14px, 2.1vw, 20px);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .headerLogo{
      height: clamp(36px, 4.8vw, 52px);
      width: auto;
      max-width: min(50vw, 340px);
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 10px 18px rgba(255,58,87,0.18));
    }

    .tag{
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 105, 132, 0.9);
      white-space: nowrap;
    }

    .panel{
      flex:1 1 auto;
      border-radius: 40px;
      border:1px solid var(--stroke);
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255,58,87,0.14), transparent 62%),
        linear-gradient(180deg, rgba(27, 29, 36, 0.82), rgba(14, 16, 22, 0.84));
      box-shadow: 0 20px 70px rgba(0,0,0,0.44), 0 0 0 1px rgba(255,58,87,0.08) inset;
      padding: clamp(16px, 2.4vw, 24px);
      display:flex;
      flex-direction:column;
      gap: clamp(14px, 1.8vw, 18px);
      min-height: 0;
    }

    .title{
      text-align:center;
      font-size: clamp(25px, 3vw, 38px);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.1;
      white-space: nowrap;
    }

    .lineupGrid{
      flex:1 1 auto;
      min-height: 0;
      display:grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(10px, 1.4vw, 14px);
    }

    .itemCard{
      border-radius: 22px;
      border:1px solid rgba(255,100,128,0.24);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,58,87,0.10), transparent 64%),
        linear-gradient(180deg, rgba(19, 21, 29, 0.88), rgba(11, 13, 19, 0.9));
      padding: 10px;
      display:flex;
      align-items:stretch;
      gap: 12px;
      box-shadow: 0 10px 34px rgba(0,0,0,0.34);
      min-width: 0;
      min-height: 0;
    }

    .thumbFrame{
      flex: 0 0 auto;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(255,100,128,0.20);
      background: rgba(12, 14, 20, 0.82);
      display:flex;
      align-items:center;
      justify-content:center;
      align-self: stretch;
      min-height: 0;
    }

    .thumb{
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display:block;
    }

    .itemName{
      font-size: clamp(21px, 2.45vw, 36px);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align:left;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .itemInfo{
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap: 4px;
    }

    .itemMeta{
      font-size: clamp(14px, 1.45vw, 20px);
      line-height: 1.2;
      color: rgba(250,250,252,0.82);
      font-weight: 700;
    }

    .itemMeta.desc{
      margin-bottom: 20px;
    }

    @media (max-width: 440px){
      .headerLogo{ height: 32px; max-width: 56vw; }
      .tag{ font-size: 11px; letter-spacing: 0.15em; }
      .title{ font-size: 20px; }
      .itemCard{
        border-radius: 16px;
        padding: 8px;
        gap: 8px;
      }
      .itemName{ font-size: 16px; }
      .itemMeta{ font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="ig-wrap" role="img" aria-label="Supporter merch lineup slide for Hack-A-Bot 2026">
    <div class="content">
      <div class="topbar">
        <img class="headerLogo" src="../../header_logo.png" alt="Hack-A-Bot 2026" />
        <div class="tag">Lineup</div>
      </div>

      <section class="panel">
        <!-- <div class="title">Lineup</div> -->

        <div class="lineupGrid" aria-label="Merch lineup tiles">
          <article class="itemCard">
            <div class="thumbFrame">
              <img class="thumb" src="../../crew%202.png" alt="Crewneck mockup thumbnail" />
            </div>
            <div class="itemInfo">
              <div class="itemName">Crew</div>
              <div class="itemMeta desc">50% Recycled Ring Spun Cotton, 50% Organic Ring Spun Cotton</div>
              <div class="itemMeta">Product Number: STSU269</div>
              <div class="itemMeta">Weight: 350 GSM</div>
            </div>
          </article>

          <article class="itemCard">
            <div class="thumbFrame">
              <img class="thumb" src="../../hoodie%202.png" alt="Hoodie mockup thumbnail" />
            </div>
            <div class="itemInfo">
              <div class="itemName">Hoodie</div>
              <div class="itemMeta desc">100% Organic Ring Spun Cotton</div>
              <div class="itemMeta">Product Number: STSU209</div>
              <div class="itemMeta">Weight: 350 GSM</div>
            </div>
          </article>

          <article class="itemCard">
            <div class="thumbFrame">
              <img class="thumb" src="../../tee%202.png" alt="Tee mockup thumbnail" />
            </div>
            <div class="itemInfo">
              <div class="itemName">Tee</div>
              <div class="itemMeta desc">100% Cotton - Organic Combed Ring Spun</div>
              <div class="itemMeta">Product Number: STTU169</div>
              <div class="itemMeta">Weight: 180 GSM</div>
            </div>
          </article>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
